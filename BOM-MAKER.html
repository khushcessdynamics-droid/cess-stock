<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>CESS Dynamics — BOM Maker</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"><style>
/* ─── Design tokens ─────────────────────────────────────────────
   Colours are WCAG-AA verified against the surfaces they sit on.
   Spacing follows a dense/dashboard scale (8→32px).            */
:root{
  --bg:#0E1620; --surface:#13202E; --surface-2:#152433; --surface-3:#1B2A3A; --surface-sunken:#0A1119;
  --text:#E8EEF4; --text-2:#B6CCDD; --text-muted:#8CA6BC; --text-faint:#7B93A8; --text-disabled:#5A7188;
  --brand:#C2692C;            /* decorative fills, borders, rings   */
  --brand-solid:#B05A22;      /* fills that carry white text 4.85:1 */
  --brand-ink:#A85420;        /* orange text on white      5.31:1   */
  --brand-on-dark:#D9772E;    /* orange text on dark       4.61:1   */
  --danger:#E57373; --ok:#3FA86B;
  --line:rgba(255,255,255,.06); --line-2:rgba(255,255,255,.10);
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px;
  --radius:8px; --radius-lg:12px;
  --tap:44px;                 /* minimum touch target              */
  --dur:.15s;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;
     overscroll-behavior:none;text-size-adjust:100%;-webkit-text-size-adjust:100%;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#28394a;border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:#37495c;}
button{font-family:inherit;}
input, select, textarea{font-family:inherit;}
button:disabled{cursor:default !important;}

/* ─── Focus visibility (WCAG 2.4.7) ─────────────────────────────
   The generated markup sets outline:none inline, so the ring has
   to be !important to win over the inline declaration.          */
:focus{outline:none;}
button:focus-visible, input:focus-visible, select:focus-visible,
textarea:focus-visible, [tabindex]:focus-visible, [data-act]:focus-visible,
a:focus-visible, label:focus-visible{
  /* longhands, not the shorthand: `outline: … var(…) !important`
     is dropped as a pending-substitution value in Blink          */
  outline-width:2px !important;
  outline-style:solid !important;
  outline-color:#D9772E !important;
  outline-offset:2px !important;
}
/* Inside the white document preview the ring needs a darker tone */
#bom-doc :focus-visible{outline-color:#A85420 !important;}

/* Kill the 300ms tap delay and stop double-tap zoom on controls */
button,[data-act],input,select,textarea,label{touch-action:manipulation;}

/* ─── Reduced motion (WCAG 2.3.3) ───────────────────────────────*/
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important; animation-iteration-count:1 !important;
    transition-duration:.01ms !important; scroll-behavior:auto !important;
  }
}

/* ─── Touch targets (WCAG 2.5.5) ────────────────────────────────
   Applied only to coarse pointers so the dense desktop layout is
   untouched; the visual box stays small while the hit area grows
   to 44px via a centred ::after overlay.                        */
/* Only needed above 1025px: at or below that the mobile stylesheet
   gives these controls real 44px boxes, and a second overlapping
   hit area would steal taps from the row above.                 */
@media (pointer:coarse) and (min-width:1025px){
  [data-act="moveCatUp"],[data-act="moveCatDown"],
  [data-act="moveItemUp"],[data-act="moveItemDown"],
  [data-act="delCat"],[data-act="toggleColor"],[data-act="pickColor"]{position:relative;}
  [data-act="moveCatUp"]::after,[data-act="moveCatDown"]::after,
  [data-act="moveItemUp"]::after,[data-act="moveItemDown"]::after,
  [data-act="delCat"]::after,[data-act="toggleColor"]::after,[data-act="pickColor"]::after{
    content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:var(--tap);height:var(--tap);
  }
  /* stacked arrows would overlap: split the 44px band vertically */
  [data-act="moveCatUp"]::after,[data-act="moveItemUp"]::after{top:0;transform:translate(-50%,-55%);height:38px;}
  [data-act="moveCatDown"]::after,[data-act="moveItemDown"]::after{top:100%;transform:translate(-50%,-45%);height:38px;}
}
@keyframes bomToastIn{from{opacity:0;transform:translateX(-50%) translateY(10px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
@keyframes bomSpin{to{transform:rotate(360deg);}}
@keyframes bomFade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
</style>
<style id="cess-responsive">
/* ─── Three-pane workspace ──────────────────────────────────────
   The editor needs ~610px when every optional column is on, so
   the side panes shrink first and the preview zoom is matched to
   the pane width it has to fit inside (doc is 794px at zoom 1).  */
#bom-grid{grid-template-columns:262px minmax(0,1fr) 452px;}
:root{--doc-zoom:.52;}

@media (max-width:1440px){
  #bom-grid{grid-template-columns:252px minmax(0,1fr) 400px;}
  :root{--doc-zoom:.45;}   /* 794*.45 = 357px inside 400-36 = 364px */
}
@media (max-width:1280px){
  /* editor keeps 1280-248-344 = 688px, clear of the ~610px it
     needs when every optional column is switched on            */
  #bom-grid{grid-template-columns:248px minmax(0,1fr) 344px;}
  :root{--doc-zoom:.38;}   /* 794*.38 = 302px inside 344-36 = 308px */
}
@media (min-width:1700px){
  #bom-grid{grid-template-columns:280px minmax(0,1fr) 500px;}
  :root{--doc-zoom:.58;}   /* 794*.58 = 461px inside 500-36 = 464px */
}

/* A dense BOM table can still outgrow its pane — scroll it inside
   the pane rather than letting it burst the page layout.        */
.bom-rows{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;}
.bom-rows::-webkit-scrollbar{height:6px;}

/* Short button labels are a mobile-only affordance */
.bom-tb-lbl-sm{display:none;}
/* Hover affordance for the top-bar actions (desktop pointers only) */
@media (hover:hover){
  .bom-tb-actions button:hover{border-color:rgba(255,255,255,.24);color:#E8EEF4;}
  .bom-tb-primary:hover{background:#C2692C;}
}
</style>
<style id="cess-mobile">
#bom-mobilebar{display:none;}
.bf{display:contents;}
/* Below 1025px the table reflows into labelled cards, so tablets
   in landscape get the readable single-pane flow instead of a
   ~360px-wide table that has to scroll sideways.                */
@media (max-width:1024px){
  #bom-grid{grid-template-columns:1fr!important;}
  #bom-panea,#bom-paneb,#bom-panec{display:none!important;border-right:none!important;}
  body[data-mpane="a"] #bom-panea{display:block!important;}
  body[data-mpane="b"] #bom-paneb{display:block!important;}
  body[data-mpane="c"] #bom-panec{display:flex!important;}
  #bom-panea,#bom-paneb{padding-bottom:96px!important;-webkit-overflow-scrolling:touch;}
  /* item rows reflow into stacked, labelled cards — no sideways scrolling */
  .bom-rows{overflow:visible!important;}
  .bom-hdr{display:none!important;}
  .bom-row{display:grid!important;grid-template-columns:1fr 1fr!important;gap:10px 10px!important;align-items:start!important;
           min-width:0!important;padding:12px!important;margin:0 0 2px!important;background:#101D2A!important;
           border-radius:10px!important;border:1px solid rgba(255,255,255,.06)!important;border-bottom:1px solid rgba(255,255,255,.06)!important;}
  .bom-grip{grid-column:1/-1!important;font-size:12px!important;gap:8px!important;padding-bottom:2px;}
  .bom-grip span:last-child{font-size:13px!important;color:#8FAFC5!important;letter-spacing:.06em;}
  /* Reorder arrows sit stacked on desktop; a stacked pair cannot
     give both halves 44px, so on touch they go side-by-side.    */
  .bom-grip>div,.bom-cat-move{flex-direction:row!important;gap:2px!important;}
  .bom-grip button,.bom-cat-move button{width:44px!important;height:44px!important;}
  .bom-grip>div button svg,.bom-cat-move button svg{width:13px;height:13px;}

  /* Title-block fields were 36px tall — below the 44px minimum  */
  #bom-panea input,#bom-panea select,#bom-panea textarea{min-height:44px!important;}
  #bom-panea textarea{min-height:76px!important;padding-top:10px!important;}

  /* Group header: the name input was being crushed to ~120px
     between the reorder controls and the colour/delete buttons.
     Give it its own full-width row and a real field affordance. */
  .bom-cat-hdr{flex-wrap:wrap!important;padding:10px 12px 12px!important;}
  .bom-cat-name{order:9;flex:1 0 100%!important;min-height:44px!important;
        background:#0A1119!important;border:1px solid rgba(255,255,255,.09)!important;
        border-radius:9px!important;padding:0 11px!important;font-size:16px!important;margin-top:2px;}
  .bom-cat-count{margin-left:auto;font-size:11px!important;}
  [data-act="delCat"]{width:44px!important;height:44px!important;font-size:20px!important;}
  [data-act="toggleColor"]{min-height:44px!important;min-width:44px!important;padding:6px 12px!important;}
  /* Toolbar: "Add Group" was wrapping onto two lines */
  .bom-pane-hdr{flex-wrap:wrap!important;}
  .bom-pane-acts{flex:1 0 100%!important;}
  .bom-pane-acts button{flex:1;min-height:44px!important;font-size:13px!important;}
  .bom-hint-drag{display:none;}
  .bf{display:flex!important;flex-direction:column;gap:5px;min-width:0;}
  .bf-wide{grid-column:1/-1;}
  .bf::before{content:attr(data-l);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;
              text-transform:uppercase;color:#8CA6BC;line-height:1;}
  .bf>input,.bf>div{width:100%!important;box-sizing:border-box!important;text-align:left!important;
        font-size:16px!important;min-height:44px!important;padding:0 11px!important;
        background:#0A1119!important;border:1px solid rgba(255,255,255,.09)!important;border-radius:9px!important;
        color:#E8EEF4!important;display:flex!important;align-items:center!important;}
  .bf>input:focus{border-color:#A85420!important;outline:none!important;}
  .bom-del{grid-column:1/-1!important;justify-self:stretch!important;width:100%!important;height:44px!important;
        border:1px solid rgba(255,255,255,.09)!important;border-radius:9px!important;font-size:13px!important;
        font-weight:600!important;color:#8AA2B5!important;background:rgba(255,255,255,.02)!important;
        display:flex!important;align-items:center!important;justify-content:center!important;gap:7px!important;}
  .bom-del::after{content:"Remove item";font-family:'Inter',sans-serif;font-size:13px;}
  [data-act="addItem"]{min-height:46px!important;font-size:14px!important;}
  #bom-panec{padding-bottom:72px!important;}
  #bom-mobilebar{display:grid!important;}
  input,select,textarea{font-size:16px!important;}

  /* ── Top bar ────────────────────────────────────────────────
     Desktop packs a logo, two tabs and five buttons into one
     row; on a phone that wrapped into three ragged lines. Here
     it becomes: row 1 = identity + actions (icon-only, 44px),
     row 2 = the Document Info / Options tabs, shown only while
     the left pane they control is actually on screen.         */
  .bom-tb{flex-wrap:wrap!important;padding:8px 12px!important;row-gap:8px!important;gap:8px!important;}
  .bom-tb-sep,.bom-tb-saved{display:none!important;}
  .bom-tb-spacer{order:3;flex:1 1 auto!important;}
  .bom-tb-logo{order:1;}
  .bom-tb-name{order:2;}
  .bom-tb-actions{order:4;gap:8px!important;}
  /* tabs drop to their own full-width row */
  .bom-tb-tabs{order:5;flex:1 0 100%!important;display:none!important;}
  body[data-mpane="a"] .bom-tb-tabs{display:flex!important;}
  .bom-tb-tabs button{flex:1;min-height:44px;font-size:13px!important;padding:6px 10px!important;}
  /* actions become square icon buttons; the label moves to aria-label */
  .bom-tb-actions button{min-height:44px!important;min-width:44px!important;height:44px!important;padding:0 12px!important;}
  .bom-tb-lbl{display:none!important;}
  .bom-tb-primary .bom-tb-lbl-sm{display:inline!important;}
  /* Price lives in Options as a checkbox too — drop the duplicate */
  [data-act="togglePrice"]{display:none!important;}
}

/* Narrow phones: shed the wordmark and every remaining button label */
@media (max-width:560px){
  .bom-tb-name{display:none!important;}
  .bom-tb-actions button>span:not(.bom-tb-lbl-sm){display:none!important;}
  .bom-tb-actions button{padding:0!important;width:44px!important;}
  .bom-tb-primary{width:auto!important;padding:0 14px!important;}
}

/* Below 1025px the preview pane spans the full viewport, so the
   794px A4 sheet can be scaled up to nearly fill it — sized to
   (viewport − 24px padding) so it never scrolls sideways.     */
@media (max-width:1024px){
  #bom-panec>div:last-child{padding:12px!important;}
  :root{--doc-zoom:.95;}                      /* 754px in 1000px */
}
@media (max-width:820px){ :root{--doc-zoom:.92;} }   /* 731 in  796 */
@media (max-width:768px){ :root{--doc-zoom:.88;} }   /* 699 in  744 */
@media (max-width:680px){ :root{--doc-zoom:.78;} }   /* 619 in  656 */
@media (max-width:560px){ :root{--doc-zoom:.64;} }   /* 508 in  536 */
@media (max-width:480px){ :root{--doc-zoom:.54;} }   /* 429 in  456 */
@media (max-width:400px){ :root{--doc-zoom:.44;} }   /* 349 in  376 */
@media (max-width:360px){ :root{--doc-zoom:.39;} }   /* 310 in  336 */
</style>
</head>
<body data-mpane="a">
<datalist id="bom-uoms"><option>Nos</option><option>Set</option><option>Pcs</option><option>Pair</option><option>Assy</option><option>m</option><option>mm</option><option>kg</option><option>g</option><option>L</option><option>Sht</option><option>Roll</option><option>Box</option><option>Lot</option></datalist>

<div style="height:100dvh;min-height:100vh;width:100%;display:flex;flex-direction:column;background:#0E1620;color:#E8EEF4;font-family:'Inter',sans-serif;overflow:hidden;">
  <div id="bom-topbar"></div>
  <div id="bom-grid" style="flex:1;display:grid;overflow:hidden;">
    <div id="bom-panea" style="background:#13202E;border-right:1px solid rgba(255,255,255,.06);overflow-y:auto;padding:17px;"></div>
    <div id="bom-paneb" style="background:#0E1620;border-right:1px solid rgba(255,255,255,.06);overflow-y:auto;padding:17px;"></div>
    <div id="bom-panec" style="background:#0A1119;display:flex;flex-direction:column;overflow:hidden;"></div>
  </div>
</div>
<div id="bom-overlays"></div>
<div id="bom-mobilebar" style="position:fixed;left:0;right:0;bottom:0;z-index:90;grid-template-columns:repeat(3,1fr);gap:7px;padding:9px 11px calc(9px + env(safe-area-inset-bottom));background:#13202E;border-top:1px solid rgba(255,255,255,.09);box-shadow:0 -6px 22px rgba(0,0,0,.35);">
  <button type="button" data-mp="a" style="min-height:44px;border:1px solid rgba(255,255,255,.08);border-radius:9px;background:rgba(194,105,44,.16);color:#E8B183;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;letter-spacing:.02em;">Details</button>
  <button type="button" data-mp="b" style="min-height:44px;border:1px solid rgba(255,255,255,.08);border-radius:9px;background:transparent;color:#8CA6BC;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;letter-spacing:.02em;">Items</button>
  <button type="button" data-mp="c" style="min-height:44px;border:1px solid rgba(255,255,255,.08);border-radius:9px;background:transparent;color:#8CA6BC;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;letter-spacing:.02em;">Preview</button>
</div>

<script>
/* CESS Dynamics — BOM Maker (self-contained rebuild) */
(function(){
'use strict';

var KEY = 'cessd_bom_pro_v5';
var SW = ['#C2692C','#2C5BA8','#1F8A5B','#8E44AD','#B7950B','#16A085','#C0392B','#5D6D7E','#2C3E50','#D9772E'];

function uid(){ return Math.random().toString(36).slice(2,9); }

function todayISO(){ return new Date().toISOString().split('T')[0]; }

function defaultDoc(){
  return {title:'',docno:'CESS-BOM-001',rev:'A',project:'Robotics Division',assemblyPart:'',client:'Internal',jobno:'',units:'mm',usedon:'',bomtype:'Engineering BOM',date:todayISO(),sheet:'1 of 1',status:'RELEASED',notes:'',sig1l:'Prepared By',sig2l:'Checked By',sig3l:'Approved By',sig1n:'',sig2n:'',sig3n:''};
}
function defaultMeta(){
  return {client:true,project:true,assemblyPart:true,revision:true,date:true,sheet:true,docno:false,status:false,jobno:false,units:false,usedon:false,bomtype:false,totalItems:false,totalQty:false,groups:false};
}
function defaultOpts(){
  return {part:true,po:true,make:true,uom:true,price:false,remarks:false,sig:true,notes:true,zebra:true,meta:defaultMeta()};
}
function defaultCats(){
  return [
    {id:uid(),name:'Mechanical Assembly',color:'#C2692C',items:[
      {id:uid(),part:'SM-A-200',name:'Servo Motor, FANUC α-series',make:'FANUC',qty:'6',uom:'Nos',price:'',remarks:''},
      {id:uid(),part:'HD-17-100',name:'Harmonic Drive Gear Unit',make:'Nabtesco',qty:'6',uom:'Nos',price:'',remarks:''},
      {id:uid(),part:'AL-6061',name:'Structural Frame, machined',make:'In-house',qty:'1',uom:'Set',price:'',remarks:''},
    ]},
    {id:uid(),name:'Pneumatic System',color:'#2C5BA8',items:[
      {id:uid(),part:'CHT34-D',name:'Double Acting Cylinder',make:'SMC',qty:'4',uom:'Nos',price:'',remarks:''},
      {id:uid(),part:'VQZ215',name:'5/2 Solenoid Valve',make:'SMC',qty:'4',uom:'Nos',price:'',remarks:''},
      {id:uid(),part:'LFR-MINI',name:'Air Service Unit (FRL)',make:'SMC',qty:'1',uom:'Set',price:'',remarks:''},
    ]},
    {id:uid(),name:'Electrical & Control',color:'#1F8A5B',items:[
      {id:uid(),part:'R-30iB',name:'Robot Controller Unit',make:'FANUC',qty:'1',uom:'Nos',price:'',remarks:''},
      {id:uid(),part:'iPendant',name:'Teach Pendant',make:'FANUC',qty:'1',uom:'Nos',price:'',remarks:''},
      {id:uid(),part:'Flexi-Soft',name:'Safety PLC',make:'SICK',qty:'1',uom:'Nos',price:'',remarks:''},
    ]},
  ];
}

function loadSaved(){
  try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){ return null; }
}

var saved = loadSaved();

var state = {
  doc: Object.assign({}, defaultDoc(), (saved && saved.doc) || {}),
  opts: (function(){
    var o = Object.assign({}, defaultOpts(), (saved && saved.opts) || {});
    o.meta = Object.assign({}, defaultMeta(), (saved && saved.opts && saved.opts.meta) || {});
    return o;
  })(),
  cats: (saved && saved.cats) || defaultCats(),
  start: (saved && saved.start != null) ? saved.start : 10,
  step: (saved && saved.step != null) ? saved.step : 10,
  tab: 'details',
  openColor: null,
  busy: '',
  toast: '',
  catDrag: null,
  itemDrag: null,
  over: null,
};

var _toastTimer = null;
var _focusNext = null; // {ci} — focus last "part" input in this category after render

function persist(){
  try {
    localStorage.setItem(KEY, JSON.stringify({doc:state.doc,opts:state.opts,cats:state.cats,start:state.start,step:state.step}));
  } catch(e){}
}

function toast(m){
  state.toast = m;
  render();
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function(){ state.toast=''; render(); }, 2400);
}

function setState(patch){
  if (typeof patch === 'function') patch = patch(state);
  Object.assign(state, patch);
  persist();
  render();
}

// ── escaping ──
function esc(v){
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(v){ return esc(v); }

// ══════════════════════════════════════════════════════════════
// EDITING ACTIONS
// ══════════════════════════════════════════════════════════════

var App = {};

App.onDoc = function(k, v){
  state.doc = Object.assign({}, state.doc, {});
  state.doc[k] = v;
  persist(); render();
};
App.onNum = function(k, v){
  var n = parseInt(v, 10);
  if (isNaN(n)) n = 0;
  if (n < 0) n = 0;
  state[k] = n;
  persist(); render();
};
App.toggleOpt = function(k){
  state.opts = Object.assign({}, state.opts);
  state.opts[k] = !state.opts[k];
  persist(); render();
};
App.togglePrice = function(){ App.toggleOpt('price'); };
App.toggleMeta = function(k){
  state.opts = Object.assign({}, state.opts, {meta: Object.assign({}, state.opts.meta)});
  state.opts.meta[k] = !state.opts.meta[k];
  persist(); render();
};
App.onCatName = function(ci, v){
  state.cats[ci].name = v;
  persist(); render();
};
App.onItem = function(ci, ii, field, v){
  state.cats[ci].items[ii][field] = v;
  persist(); render();
};
App.addItem = function(ci){
  _focusNext = ci;
  state.cats[ci].items = state.cats[ci].items.concat([{id:uid(),part:'',name:'',make:'—',qty:'1',uom:'Nos',price:'',remarks:''}]);
  persist(); render();
};
App.delItem = function(ci, ii){
  state.cats[ci].items = state.cats[ci].items.filter(function(_, i){ return i !== ii; });
  persist(); render();
};
App.addCat = function(){
  state.cats = state.cats.concat([{id:uid(), name:'New Group', color: SW[state.cats.length % SW.length], items:[]}]);
  persist(); render();
};
App.delCat = function(ci){
  state.cats = state.cats.filter(function(_, i){ return i !== ci; });
  persist(); render();
};
App.toggleColor = function(ci){
  state.openColor = (state.openColor === ci) ? null : ci;
  render();
};
App.pickColor = function(ci, c){
  state.cats[ci].color = c;
  state.openColor = null;
  persist(); render();
};
App.moveCatUp = function(ci){
  if (ci <= 0) return;
  var tmp = state.cats[ci-1]; state.cats[ci-1] = state.cats[ci]; state.cats[ci] = tmp;
  persist(); render();
};
App.moveCatDown = function(ci){
  if (ci >= state.cats.length - 1) return;
  var tmp = state.cats[ci+1]; state.cats[ci+1] = state.cats[ci]; state.cats[ci] = tmp;
  persist(); render();
};
App.moveItemUp = function(ci, ii){
  if (ii <= 0) return;
  var items = state.cats[ci].items;
  var tmp = items[ii-1]; items[ii-1] = items[ii]; items[ii] = tmp;
  persist(); render();
};
App.moveItemDown = function(ci, ii){
  var cat = state.cats[ci];
  if (!cat || ii >= cat.items.length - 1) return;
  var items = cat.items;
  var tmp = items[ii+1]; items[ii+1] = items[ii]; items[ii] = tmp;
  persist(); render();
};

// ── drag: items ──
App.onItemDragStart = function(ev, ci, ii){
  ev.stopPropagation();
  state.itemDrag = {ci:ci, ii:ii};
  state.catDrag = null;
  try { ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain','i'); } catch(_){}
};
App.onItemDragOver = function(ev, ci, ii){
  if (!state.itemDrag) return;
  ev.preventDefault(); ev.stopPropagation();
  ev.dataTransfer.dropEffect = 'move';
  var o = state.over;
  if (!o || o.t!=='i' || o.ci!==ci || o.ii!==ii){ state.over = {t:'i',ci:ci,ii:ii}; render(); }
};
App.onItemDrop = function(ev, ci, ii){
  if (!state.itemDrag) return;
  ev.preventDefault(); ev.stopPropagation();
  var from = state.itemDrag, to = {ci:ci, ii:ii};
  var cats = state.cats.map(function(c){ return Object.assign({}, c, {items: c.items.slice()}); });
  var moved = cats[from.ci].items.splice(from.ii, 1)[0];
  if (moved){
    var ti = to.ii;
    if (from.ci === to.ci && from.ii < to.ii) ti--;
    cats[to.ci].items.splice(ti, 0, moved);
    state.cats = cats;
  }
  state.itemDrag = null; state.over = null;
  persist(); render();
};

// ── drag: groups ──
App.onCatDragStart = function(ev, ci){
  if (state.itemDrag) return;
  state.catDrag = ci;
  try { ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain','c'); } catch(_){}
};
App.onCatDragOver = function(ev, ci){
  if (state.catDrag == null || state.itemDrag) return;
  ev.preventDefault();
  var o = state.over;
  if (!o || o.t!=='c' || o.ci!==ci){ state.over = {t:'c',ci:ci}; render(); }
};
App.onCatDrop = function(ev, ci){
  if (state.catDrag == null || state.itemDrag) return;
  ev.preventDefault();
  var to = ci, from = state.catDrag;
  var cats = state.cats.slice();
  var moved = cats.splice(from, 1)[0];
  var ti = to; if (from < to) ti--;
  cats.splice(ti, 0, moved);
  state.cats = cats; state.catDrag = null; state.over = null;
  persist(); render();
};
App.onDragEnd = function(){
  state.itemDrag = null; state.catDrag = null; state.over = null;
  render();
};

App.setDetails = function(){ state.tab = 'details'; render(); };
App.setOptions = function(){ state.tab = 'options'; render(); };

// ── save / open ──
App.saveProject = function(){
  var data = {app:'CESS-BOM', version:4, doc:state.doc, opts:state.opts, cats:state.cats, start:state.start, step:state.step};
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var name = (state.doc.docno || 'CESS-BOM').replace(/[^a-z0-9_-]+/gi, '_');
  a.href = url; a.download = name + '.cessbom.json'; a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  toast('Project saved — reopen anytime to edit');
};
App.openProject = function(){
  var el = document.getElementById('bom-file-input');
  if (el) el.click();
};
App.onOpenFile = function(ev){
  var f = ev.target.files && ev.target.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    try {
      var d = JSON.parse(r.result);
      if (!d.cats){ toast('Not a valid BOM project file'); return; }
      state.doc = Object.assign({}, state.doc, d.doc || {});
      state.opts = Object.assign({}, state.opts, d.opts || {});
      state.opts.meta = Object.assign({}, defaultMeta(), (d.opts && d.opts.meta) || {});
      state.cats = d.cats || [];
      state.start = d.start != null ? d.start : 10;
      state.step = d.step != null ? d.step : 10;
      persist(); render();
      toast('Project loaded ✓');
    } catch(err){ toast('Could not read that file'); }
  };
  r.readAsText(f);
  ev.target.value = '';
};
App.resetAll = async function(){
  if (!await bomAsk('Reset to a blank BOM?', 'This clears every component and all document info. It cannot be undone.', 'Reset')) return;
  var meta = {client:true,project:true,assemblyPart:true,revision:true,date:true,sheet:true,docno:false,status:false,jobno:false,units:false,usedon:false,bomtype:false,totalItems:false,totalQty:false,groups:false};
  state.doc = {title:'',docno:'CESS-BOM-001',rev:'A',project:'',assemblyPart:'',client:'',jobno:'',units:'mm',usedon:'',bomtype:'Engineering BOM',date:todayISO(),sheet:'1 of 1',status:'DRAFT',notes:'',sig1l:'Prepared By',sig2l:'Checked By',sig3l:'Approved By',sig1n:'',sig2n:'',sig3n:''};
  state.opts = {part:true,make:true,uom:true,price:false,remarks:false,sig:true,notes:true,zebra:true,meta:meta};
  state.cats = [];
  state.start = 10; state.step = 10;
  persist(); render();
  toast('Reset to blank BOM');
};

function fname(ext){
  var n = (state.doc.docno || 'CESS_BOM').replace(/[^a-z0-9_-]+/gi, '_');
  return n + '_Rev' + (state.doc.rev || '').replace(/[^a-z0-9]+/gi, '') + '.' + ext;
}

function renderCanvas(){
  var src = document.getElementById('bom-doc');
  if (!src) return Promise.resolve(null);
  var wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;left:-99999px;top:0;width:794px;background:#fff;z-index:-1;';
  var clone = src.cloneNode(true);
  Array.prototype.slice.call(clone.querySelectorAll('.bom-pgguide')).forEach(function(n){ n.parentNode.removeChild(n); });
  clone.style.boxShadow = 'none';
  clone.style.zoom = '1';
  wrap.appendChild(clone);
  document.body.appendChild(wrap);
  var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready.catch(function(){}) : Promise.resolve();
  return fontsReady.then(function(){
    return new Promise(function(r){ setTimeout(r, 300); });
  }).then(function(){
    return window.html2canvas(clone, {scale:(window.__CESS_IOS ? 1.4 : 2.2), useCORS:true, backgroundColor:'#ffffff', logging:false, windowWidth:794});
  }).then(function(canvas){
    var base = clone.getBoundingClientRect();
    var docH = base.height;
    var breaks = [];
    Array.prototype.forEach.call(clone.querySelectorAll('tr, thead, .bom-sig, .bom-notes'), function(el){
      var r = el.getBoundingClientRect();
      if (r.height > 0) breaks.push(r.bottom - base.top);
    });
    breaks.push(docH);
    breaks = breaks.filter(function(v,i,a){ return v > 0 && a.indexOf(v) === i; }).sort(function(x,y){ return x-y; });
    document.body.removeChild(wrap);
    return {canvas: canvas, breaks: breaks, docH: docH};
  }).catch(function(err){
    if (wrap.parentNode) document.body.removeChild(wrap);
    throw err;
  });
}

App.exportPNG = function(){
  state.busy = 'Rendering PNG…'; render();
  renderCanvas().then(function(out){
    var canvas = out.canvas;
    var a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = fname('png');
    a.click();
    toast('PNG downloaded ✓');
  }).catch(function(err){
    console.error(err);
    toast('Export failed');
  }).then(function(){ state.busy=''; render(); });
};

App.exportPDF = function(){
  state.busy = 'Generating PDF…'; render();
  renderCanvas().then(function(out){
    var canvas = out.canvas, breaks = out.breaks, docH = out.docH;
    var jsPDF = window.jspdf.jsPDF;
    var pdf = new jsPDF({orientation:'portrait', unit:'mm', format:'a4'});
    var pw = 210, ph = 297;
    var DOC_W = 794;                    // clone width in CSS px  = 210mm
    var PAGE_PX = DOC_W * ph / pw;      // one A4 page in CSS px  ≈ 1122.9
    var sf = canvas.height / docH;      // canvas px per CSS px
    var MIN_PAGE = PAGE_PX * 0.25;      // never emit a sliver of a page

    if (docH <= PAGE_PX + 1){
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, pw, docH * pw / DOC_W);
    } else {
      var top = 0, guard = 0;
      while (top < docH - 1 && guard++ < 200){
        var limit = top + PAGE_PX;
        var bottom;
        if (limit >= docH - 1){
          bottom = docH;                                   // last page: whatever is left
        } else {
          bottom = 0;
          for (var i = 0; i < breaks.length; i++){         // last row that ends on this page
            if (breaks[i] > top + MIN_PAGE && breaks[i] <= limit) bottom = breaks[i];
          }
          if (!bottom) bottom = limit;                     // nothing to break on — hard cut
        }
        var sliceH = Math.max(1, Math.round((bottom - top) * sf));
        var tmp = document.createElement('canvas');
        tmp.width = canvas.width; tmp.height = sliceH;
        var ctx = tmp.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, tmp.width, tmp.height);
        ctx.drawImage(canvas, 0, Math.round(top * sf), canvas.width, sliceH,
                              0, 0, canvas.width, sliceH);
        pdf.addImage(tmp.toDataURL('image/png'), 'PNG', 0, 0, pw, (bottom - top) * pw / DOC_W);
        top = bottom;
        if (top < docH - 1) pdf.addPage();
      }
    }
    try { pdf.save(fname('pdf')); }
    catch(_e){
      try { var bu = pdf.output('bloburl'); window.open(bu, '_blank'); }
      catch(_e2){ toast('Could not open PDF — try Chrome'); }
    }
    toast('PDF downloaded ✓');
  }).catch(function(err){
    console.error(err);
    toast('Export failed');
  }).then(function(){ state.busy=''; render(); });
};

function computeView(){
  var s = state, d = s.doc, o = s.opts;
  var part = !!o.part, make = !!o.make, uom = !!o.uom, price = !!o.price, remarks = !!o.remarks, po = !!o.po;

  var ec = ['54px'];
  if (part) ec.push('minmax(54px,0.8fr)');
  if (po) ec.push('minmax(58px,0.9fr)');
  ec.push('minmax(90px,2.1fr)');
  if (make) ec.push('minmax(50px,0.75fr)');
  ec.push('40px');
  if (uom) ec.push('40px');
  if (price) ec.push('minmax(54px,0.75fr)','minmax(54px,0.75fr)');
  if (remarks) ec.push('minmax(70px,1.3fr)');
  ec.push('22px');
  var editCols = ec.join(' ');

  var colspan = 3 + (part?1:0) + (po?1:0) + (make?1:0) + (uom?1:0) + (price?2:0) + (remarks?1:0);

  var g=0, totalQty=0, totalItems=0, grandTotal=0;
  var catsView = s.cats.map(function(cat, ci){
    var items = cat.items.map(function(it, ii){
      var line = String(s.start + g*s.step).padStart(4,'0'); g++; totalItems++;
      var qn = parseFloat(it.qty) || 0; totalQty += qn;
      var pn = curr(it.price); var amt = pn != null ? pn*qn : null; if (amt != null) grandTotal += amt;
      var zebra = o.zebra && (ii % 2 === 1);
      var over = s.over && s.over.t==='i' && s.over.ci===ci && s.over.ii===ii && !(s.itemDrag && s.itemDrag.ci===ci && s.itemDrag.ii===ii);
      var iFirst = ii===0, iLast = ii===cat.items.length-1;
      return {
        id: it.id, part: it.part, name: it.name, make: it.make, qty: it.qty, uom: it.uom, price: it.price, remarks: it.remarks, po: it.po,
        ci: ci, ii: ii, line: line,
        partDisp: (it.part||'').trim() || '—', nameDisp: (it.name||'').trim() || '—', makeDisp: (it.make||'').trim() || '—',
        qtyDisp: (it.qty||'').trim() || '—', uomDisp: (it.uom||'').trim() || '—', remarksDisp: (it.remarks||'').trim() || '—',
        poDisp: (it.po||'').trim() || '—',
        priceDisp: pn != null ? fmtCurr(pn) : '—', amountDisp: amt != null ? fmtCurr(amt) : '—',
        rowStyle: zebra ? 'background:#F7FAFC;' : 'background:#fff;', dropTop: over,
        iFirst: iFirst, iLast: iLast,
      };
    });
    var n = cat.items.length;
    var isFirst = ci===0, isLast = ci===s.cats.length-1;
    return {
      id: cat.id, name: cat.name, color: cat.color, ci: ci, items: items,
      colorOpen: s.openColor===ci,
      itemCountLabel: n + ' item' + (n===1?'':'s'),
      isFirst: isFirst, isLast: isLast,
      dropTop: s.over && s.over.t==='c' && s.over.ci===ci && s.catDrag!=null && s.catDrag!==ci,
    };
  });

  var dr = d.date ? new Date(d.date) : new Date();
  var dDate = isNaN(dr) ? '—' : dr.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
  var np = String(s.start).padStart(4,'0') + ', ' + String(s.start+s.step).padStart(4,'0') + ', ' + String(s.start+2*s.step).padStart(4,'0') + '…';

  var meta = o.meta || {};
  var V = function(v){ return String(v==null?'':v).trim() || '—'; };
  var reg = [
    ['client','Client',V(d.client)],
    ['project','Project',V(d.project)],
    ['assemblyPart','Assembly Part No.',V(d.assemblyPart)],
    ['revision','Revision',V(d.rev)||'A'],
    ['date','Date',dDate],
    ['sheet','Sheet',V(d.sheet)],
    ['docno','Document No.',V(d.docno)],
    ['status','Status',V(d.status)],
    ['jobno','Job / WO No.',V(d.jobno)],
    ['units','Units',V(d.units)],
    ['usedon','Used-On / Next Assy',V(d.usedon)],
    ['bomtype','BOM Type',V(d.bomtype)],
    ['totalItems','Total Items',String(totalItems)],
    ['totalQty','Total Qty', totalQty%1===0 ? String(totalQty) : totalQty.toFixed(1)],
    ['groups','Groups',String(s.cats.length)],
  ];
  var metaCells = reg.filter(function(r){ return meta[r[0]]; }).map(function(r){ return {label:r[1], val:r[2]}; });
  var metaToggles = reg.map(function(r){ return {key:r[0], label:r[1], on: !!meta[r[0]]}; });

  return {
    part: part, make: make, uom: uom, price: price, remarks: remarks, po: po,
    editCols: editCols, colspan: colspan,
    catsView: catsView, totalItems: totalItems, totalQty: totalQty, grandTotal: grandTotal,
    dDate: dDate, np: np, metaCells: metaCells, metaToggles: metaToggles,
    statusColor: statusColors[d.status] || '#5D6D7E',
    dTitle: (d.title||'').trim() || 'Untitled Assembly',
    dDocno: (d.docno||'').trim() || '—', dRev: (d.rev||'').trim() || 'A', dSheet: (d.sheet||'').trim() || '1 of 1',
    dSig1n: (d.sig1n||'').trim() || '—', dSig2n: (d.sig2n||'').trim() || '—', dSig3n: (d.sig3n||'').trim() || '—',
    showNotesBar: o.notes && !!(d.notes||'').trim(),
    hasMeta: metaCells.length > 0,
    year: new Date().getFullYear(),
  };
}

function renderDocTable(v){
  var s = state;
  var heads = '<th style="'+THL+'width:6%;white-space:nowrap;">Item</th>';
  if (v.part) heads += '<th style="'+THL+'width:9%;white-space:nowrap;">Part No.</th>';
  if (v.po) heads += '<th style="'+THL+'width:9%;white-space:nowrap;">PO / Ref</th>';
  heads += '<th style="'+THL+'white-space:nowrap;">Description</th>';
  if (v.make) heads += '<th style="'+THL+'width:8%;white-space:nowrap;">Make</th>';
  heads += '<th style="'+THC+'width:6%;white-space:nowrap;">Qty</th>';
  if (v.uom) heads += '<th style="'+THC+'width:6%;white-space:nowrap;">UOM</th>';
  if (v.price) heads += '<th style="'+THC+'width:8%;white-space:nowrap;">Price</th><th style="'+THC+'width:9%;white-space:nowrap;">Amount</th>';
  if (v.remarks) heads += '<th style="'+THL+'width:14%;white-space:nowrap;">Remarks</th>';

  var bodyRows = '';
  v.catsView.forEach(function(cat){
    bodyRows += '<tr><td colspan="'+v.colspan+'" style="padding:0;border:1px solid #16243A;">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 11px;background:'+cat.color+';color:#fff;font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;">'+
      '<span>'+esc(cat.name || 'Untitled Group')+'</span><span style="opacity:.85;font-family:\'DM Mono\',monospace;letter-spacing:.04em;font-weight:500;">'+esc(cat.itemCountLabel)+'</span></div></td></tr>';
    cat.items.forEach(function(it){
      var cells = '<td style="'+TDMONO+'color:#8597A8;">'+esc(it.line)+'</td>';
      if (v.part) cells += '<td style="'+TDMONO+'color:#42566B;word-break:break-word;">'+esc(it.partDisp)+'</td>';
      if (v.po) cells += '<td style="'+TDMONO+'color:#A85420;word-break:break-word;">'+esc(it.poDisp)+'</td>';
      cells += '<td style="'+TDBASE+'color:#1A2532;font-weight:500;word-break:break-word;line-height:1.4;">'+esc(it.nameDisp)+'</td>';
      if (v.make) cells += '<td style="'+TDBASE+'font-size:10px;color:#5A6B7B;word-break:break-word;">'+esc(it.makeDisp)+'</td>';
      cells += '<td style="'+TDMONO+'text-align:center;font-weight:600;color:#16243A;">'+esc(it.qtyDisp)+'</td>';
      if (v.uom) cells += '<td style="'+TDMONO+'text-align:center;color:#5A6B7B;">'+esc(it.uomDisp)+'</td>';
      if (v.price) cells += '<td style="'+TDMONO+'text-align:right;color:#5A6B7B;">'+esc(it.priceDisp)+'</td><td style="'+TDMONO+'text-align:right;font-weight:600;color:#16243A;">'+esc(it.amountDisp)+'</td>';
      if (v.remarks) cells += '<td style="'+TDBASE+'font-size:10px;color:#5A6B7B;word-break:break-word;line-height:1.4;">'+esc(it.remarksDisp)+'</td>';
      bodyRows += '<tr style="'+it.rowStyle+'">'+cells+'</tr>';
    });
  });
  if (state.cats.length === 0){
    bodyRows += '<tr><td colspan="'+v.colspan+'" style="border:1px solid #DDE5EC;padding:40px;text-align:center;color:#9aabbb;font-size:12px;">No components added yet</td></tr>';
  }
  if (v.price && v.grandTotal > 0 && state.cats.length > 0){
    var preSpan = 1 + (v.part?1:0) + 1 + (v.make?1:0) + 1 + (v.uom?1:0);
    bodyRows += '<tr><td colspan="'+preSpan+'" style="padding:8px 11px;border:1px solid #DDE5EC;text-align:right;font-weight:700;font-size:10.5px;color:#16243A;background:#F7FAFC;">Grand Total</td>'+

      '<td style="padding:8px 11px;border:1px solid #DDE5EC;text-align:right;font-weight:800;font-family:\'DM Mono\',monospace;font-size:11px;color:#16243A;background:#F7FAFC;">'+fmtCurr(v.grandTotal)+'</td>'+
      (v.remarks ? '<td style="border:1px solid #DDE5EC;background:#F7FAFC;"></td>' : '') + '</tr>';
  }
  return '<table style="width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed;"><thead><tr>'+heads+'</tr></thead><tbody>'+bodyRows+'</tbody></table>';
}

function fieldRow(labelHtml, inputHtml){
  return '<div style="margin-bottom:11px;"><div style="'+LBL+'">'+labelHtml+'</div>'+inputHtml+'</div>';
}
function textInput(k, val, placeholder, extra){
  return '<input value="'+escAttr(val)+'" data-k="'+k+'" data-act="onDoc" placeholder="'+escAttr(placeholder||'')+'" style="'+INP+(extra||'')+'">';
}

      fieldRow('Sheet', textInput('sheet', d.sheet, '1 of 1'))+

        return '<option'+(d.status===opt?' selected':'')+'>'+opt+'</option>';
      }).join('')+'</select>')+
    fieldRow('Notes', '<textarea data-k="notes" data-act="onDoc" placeholder="Optional remarks…" style="'+INP+'resize:vertical;min-height:50px;font-family:\'Inter\',sans-serif;">'+esc(d.notes)+'</textarea>')+
    '<div style="height:1px;background:rgba(255,255,255,.06);margin:14px 0;"></div>'+

    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;">'+
      '<div style="margin-bottom:9px;"><div style="'+LBLSM+'">Role 1</div><input value="'+escAttr(d.sig1l)+'" data-k="sig1l" data-act="onDoc" style="'+INPSM+'"></div>'+
      '<div style="margin-bottom:9px;"><div style="'+LBLSM+'">Name 1</div><input value="'+escAttr(d.sig1n)+'" data-k="sig1n" data-act="onDoc" placeholder="—" style="'+INPSM+'"></div>'+

      '<div style="margin-bottom:9px;"><div style="'+LBLSM+'">Role 3</div><input value="'+escAttr(d.sig3l)+'" data-k="sig3l" data-act="onDoc" style="'+INPSM+'"></div>'+

    '</div>'+

    '<div style="height:1px;background:rgba(255,255,255,.06);margin:16px 0;"></div>'+
    '<div style="font-size:9.5px;font-family:\'DM Mono\',monospace;letter-spacing:.13em;text-transform:uppercase;color:#8CA6BC;margin-bottom:4px;">Title Block Fields</div>'+

function renderPaneB(v){

  '<div class="bom-pane-hdr" style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px;">'+

  '</div>'+
  '<div style="display:flex;flex-direction:column;gap:12px;">';

  v.catsView.forEach(function(cat){
    var arrBtn = "width:15px;height:13px;border-radius:3px;background:transparent;border:none;display:grid;place-items:center;transition:.12s;padding:0;";
    var upStyle = arrBtn + (cat.isFirst ? 'color:#5A7188;cursor:default;' : 'color:#8CA6BC;cursor:pointer;');
    var downStyle = arrBtn + (cat.isLast ? 'color:#5A7188;cursor:default;' : 'color:#8CA6BC;cursor:pointer;');

    out += '<div draggable="true" data-act="catDrag" data-ci="'+cat.ci+'" style="background:#152433;border-radius:10px;border:1px solid rgba(255,255,255,.06);position:relative;transition:border-color .15s;">';
    if (cat.dropTop) out += '<div style="position:absolute;top:-7px;left:0;right:0;height:3px;background:#D9772E;border-radius:3px;box-shadow:0 0 8px rgba(217,119,46,.7);"></div>';

    out += '<div class="bom-cat-hdr" style="padding:10px 12px;display:flex;align-items:center;gap:9px;border-bottom:1px solid rgba(255,255,255,.05);">'+
      '<span class="bom-cat-grip" title="Drag group" style="cursor:grab;color:#7B93A8;font-size:14px;line-height:1;user-select:none;">⠿</span>'+
      '<div class="bom-cat-move" style="display:flex;flex-direction:column;gap:1px;flex-shrink:0;">'+
        '<button data-act="moveCatUp" data-ci="'+cat.ci+'" aria-label="Move group up" title="Move group up" style="'+upStyle+'" '+(cat.isFirst?'disabled':'')+'>'+iconUp(10,3)+'</button>'+
        '<button data-act="moveCatDown" data-ci="'+cat.ci+'" aria-label="Move group down" title="Move group down" style="'+downStyle+'" '+(cat.isLast?'disabled':'')+'>'+iconDown(10,3)+'</button>'+
      '</div>'+
      '<div class="bom-cat-swatch" style="width:3px;height:24px;border-radius:3px;flex-shrink:0;background:'+cat.color+';"></div>'+

function dispatch(act, target, ev){
  var ci = target.dataset.ci != null ? +target.dataset.ci : null;
  var ii = target.dataset.ii != null ? +target.dataset.ii : null;
  var k = target.dataset.k;
  var mk = target.dataset.mk;
  var field = target.dataset.field;
  var c = target.dataset.c;

  switch(act){
    case 'setDetails': App.setDetails(); break;
    case 'pasteOpen': App.pasteOpen(); break;
    case 'pasteRead': App.pasteRead(); break;
    case 'pasteApply': App.pasteApply(); break;
    case 'pasteClose': App.pasteClose(); break;
    case 'setOptions': App.setOptions(); break;
    case 'openProject': App.openProject(); break;
    case 'saveProject': App.saveProject(); break;
    case 'togglePrice': App.togglePrice(); break;
    case 'exportPNG': App.exportPNG(); break;
    case 'exportPDF': App.exportPDF(); break;
    case 'toggleOpt': App.toggleOpt(k); break;
    case 'toggleMeta': App.toggleMeta(mk); break;
    case 'onDoc': App.onDoc(k, target.value); break;
    case 'onNum': App.onNum(k, target.value); break;
    case 'onCatName': App.onCatName(ci, target.value); break;
    case 'onItem': App.onItem(ci, ii, field, target.value); break;
    case 'addItem': App.addItem(ci); break;
    case 'delItem': App.delItem(ci, ii); break;
    case 'addCat': App.addCat(); break;
    case 'delCat': App.delCat(ci); break;
    case 'toggleColor': App.toggleColor(ci); break;
    case 'pickColor': App.pickColor(ci, c); break;
    case 'moveCatUp': App.moveCatUp(ci); break;
    case 'moveCatDown': App.moveCatDown(ci); break;
    case 'moveItemUp': App.moveItemUp(ci, ii); break;
    case 'moveItemDown': App.moveItemDown(ci, ii); break;
    case 'resetAll': App.resetAll(); break;
    case 'onOpenFile': App.onOpenFile(ev); break;
  }
}

document.addEventListener('click', function(ev){
  var t = ev.target.closest('[data-act]');
  if (!t) return;
  var act = t.dataset.act;
  var passthrough = ['onDoc','onNum','onCatName','onItem','onOpenFile','itemDrag','catDrag'];
  if (passthrough.indexOf(act) !== -1) return;
  dispatch(act, t, ev);
});

document.addEventListener('change', function(ev){
  var t = ev.target;
  var el = t.closest('[data-act]');
  if (!el) return;
  var act = el.dataset.act;
  if (act === 'onDoc' || act === 'onNum' || act === 'onCatName' || act === 'onItem' || act === 'onOpenFile'){
    dispatch(act, el, ev);
  }
});

// drag events (delegated via capture since drag events don't bubble to document reliably in all browsers, but dragstart/dragover/drop do bubble)
document.addEventListener('dragstart', function(ev){
  var t = ev.target.closest('[data-act="catDrag"], [data-act="itemDrag"]');
  if (!t) return;
  if (t.dataset.act === 'catDrag') App.onCatDragStart(ev, +t.dataset.ci);
  else App.onItemDragStart(ev, +t.dataset.ci, +t.dataset.ii);
});
document.addEventListener('dragover', function(ev){
  var t = ev.target.closest('[data-act="catDrag"], [data-act="itemDrag"]');
  if (!t) return;
  if (t.dataset.act === 'catDrag') App.onCatDragOver(ev, +t.dataset.ci);
  else App.onItemDragOver(ev, +t.dataset.ci, +t.dataset.ii);
});
document.addEventListener('drop', function(ev){
  var t = ev.target.closest('[data-act="catDrag"], [data-act="itemDrag"]');
  if (!t) return;
  if (t.dataset.act === 'catDrag') App.onCatDrop(ev, +t.dataset.ci);

});
document.addEventListener('dragend', function(ev){
  var t = ev.target.closest('[data-act="catDrag"], [data-act="itemDrag"]');

});

function fitDoc(){
  var d = document.getElementById('bom-doc');
  if (!d || !d.parentNode) return;
  var avail = d.parentNode.clientWidth - 36;
  if (avail <= 0) return;
  d.style.zoom = String(Math.min(1, Math.max(.24, avail / 794)).toFixed(3));
  if (typeof drawPageGuides === 'function') drawPageGuides();
}

// ── live A4 page-break guides (794px doc width ⇒ one 297mm page = 1122.9px) ──
var PAGE_PX = 794 * 297 / 210;
function drawPageGuides(){
  var d = document.getElementById('bom-doc');
  if (!d) return;
  d.style.position = 'relative';
  var host = d.querySelector('.bom-pgguide');
  if (!host){
    host = document.createElement('div');
    host.className = 'bom-pgguide';
    host.setAttribute('data-html2canvas-ignore','true');
    host.style.cssText = 'position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;z-index:4;';
    d.appendChild(host);
  }
  var z = parseFloat(d.style.zoom) || 1;
  var h = d.getBoundingClientRect().height / z;
  if (h < 40) return;
  var pages = Math.max(1, Math.ceil((h - 2) / PAGE_PX));
  var out = '';
  for (var p = 1; p < pages; p++){
    var y = p * PAGE_PX;
    out += '<div style="position:absolute;left:0;right:0;top:'+y+'px;height:0;border-top:1px dashed rgba(194,105,44,.62);"></div>'+
           '<div style="position:absolute;right:0;top:'+(y+3)+'px;padding:2px 7px;background:#B05A22;color:#fff;border-radius:0 0 5px 5px;font-family:\'DM Mono\',monospace;font-size:8px;letter-spacing:.12em;">PAGE '+(p+1)+'</div>';
  }
  host.innerHTML = pages > 1 ? out : '';
  var badge = document.getElementById('bom-pgcount');
  if (badge) badge.textContent = pages + (pages === 1 ? ' page' : ' pages');
}

    w.innerHTML = '<div style="width:100%;max-width:420px;background:#13202E;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.5);">'+

      '<button data-r="1" style="flex:1;min-height:46px;border-radius:10px;border:none;background:#B05A22;color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;">'+esc(okLabel||'Confirm')+'</button>'+
      '</div></div>';

    function done(v){ if (w.parentNode) w.parentNode.removeChild(w); resolve(v); }

}

function pasteRows(){
  var ta = document.getElementById('bom-paste-ta');
  if (!ta) return [];
  return ta.value.split(/\r?\n/)
    .map(function(l){ return l.trim() ? l.split(/\t|,(?=(?:[^"]*"[^"]*")*[^"]*$)/) : null; })
    .filter(Boolean)
    .map(function(c){ return c.map(function(x){ return String(x||'').trim().replace(/^"|"$/g,''); }); })
    .filter(function(c){ return c.some(function(x){ return x !== ''; }); });
}
function pasteInfo(){
  var el = document.getElementById('bom-paste-info');
  if (!el) return;
  var r = pasteRows();
  el.textContent = r.length ? (r.length + (r.length === 1 ? ' row' : ' rows') + ' detected · ' + r[0].length + ' columns') : '';
  el.style.color = r.length ? '#7FB88F' : '#8CA6BC';
}

    if (!t){ toast('Clipboard is empty'); return; }
    var ta = document.getElementById('bom-paste-ta');
    ta.value = t; pasteInfo(); toast('Clipboard read ✓');
  }).catch(function(){
    toast('Paste into the box instead — this browser blocks clipboard reads');
    var t1 = document.getElementById('bom-paste-ta'); if (t1) t1.focus();
  });
};
App.pasteClose = function(){ if (pasteEl && pasteEl.parentNode) pasteEl.parentNode.removeChild(pasteEl); pasteEl = null; };
App.pasteApply = function(){
  var rows = pasteRows();
  if (!rows.length){ toast('Nothing to add — paste some rows first'); return; }
  var sel = document.getElementById('bom-paste-grp');
  var target;
  if (!sel || sel.value === 'new' || !state.cats.length){
    state.cats.push({name:'Pasted components', color:'#C2692C', items:[]});
    target = state.cats[state.cats.length - 1];
  } else target = state.cats[+sel.value] || state.cats[0];
  rows.forEach(function(c){
    target.items.push({ part:c[0]||'', name:c[1]||'', make:c[2]||'', qty:c[3]||'1',
                        uom:c[4]||'Nos', price:c[5]||'', remarks:c[6]||'', po:c[7]||'' });
  });
  App.pasteClose();
  persist(); render();
  toast(rows.length + (rows.length === 1 ? ' component' : ' components') + ' added ✓');
};
window.addEventListener('orientationchange', function(){ setTimeout(fitDoc, 220); });

document.getElementById('bom-mobilebar').addEventListener('click', function(ev){
  var b = ev.target.closest('[data-mp]');
  if (!b) return;
  document.body.dataset.mpane = b.dataset.mp;
  this.querySelectorAll('[data-mp]').forEach(function(x){
    var on = x === b;
    x.style.background = on ? 'rgba(194,105,44,.16)' : 'transparent';
    x.style.color = on ? '#E8B183' : '#8CA6BC';
  });
  setTimeout(function(){ fitDoc(); drawPageGuides(); }, 30);
});

// touch drag-and-drop (iOS Safari never fires HTML5 drag events)
(function(){
  var LONG = 270, st = null;
  function fakeEv(){ return {preventDefault:function(){},stopPropagation:function(){},dataTransfer:{setData:function(){},effectAllowed:'',dropEffect:''}}; }
  function handle(el){ return el && el.closest ? el.closest('[data-act="catDrag"],[data-act="itemDrag"]') : null; }
  document.addEventListener('pointerdown', function(ev){
    if (ev.pointerType === 'mouse' || !ev.isPrimary) return;
    if (ev.target.closest('input,select,textarea,button,[data-act="del"]')) return;
    var t = handle(ev.target);
    if (!t) return;
    st = {t:t, x:ev.clientX, y:ev.clientY, on:false, last:null};
    st.timer = setTimeout(function(){
      if (!st) return;
      st.on = true;
      document.body.style.touchAction = 'none';
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch(_){} }
      var e = fakeEv();
      if (st.t.dataset.act === 'catDrag') App.onCatDragStart(e, +st.t.dataset.ci);
      else App.onItemDragStart(e, +st.t.dataset.ci, +st.t.dataset.ii);
    }, LONG);
  }, {passive:true});
  document.addEventListener('pointermove', function(ev){
    if (!st) return;
    if (!st.on){
      if (Math.abs(ev.clientX - st.x) > 10 || Math.abs(ev.clientY - st.y) > 10){ clearTimeout(st.timer); st = null; }
      return;
    }
    ev.preventDefault();
    var over = handle(document.elementFromPoint(ev.clientX, ev.clientY));
    if (!over) return;
    var e = fakeEv();
    if (over.dataset.act === 'catDrag') App.onCatDragOver(e, +over.dataset.ci);
    else App.onItemDragOver(e, +over.dataset.ci, +over.dataset.ii);
    st.last = {act:over.dataset.act, ci:+over.dataset.ci, ii:+over.dataset.ii};
  }, {passive:false});
  function end(){
    if (!st) return;
    clearTimeout(st.timer);
    document.body.style.touchAction = '';
    if (st.on){
      var e = fakeEv(), L = st.last;
      if (L){
        if (L.act === 'catDrag') App.onCatDrop(e, L.ci);
        else App.onItemDrop(e, L.ci, L.ii);
      } else App.onDragEnd();
    }
    st = null;
  }
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
})();

// kick off
render();

})();
