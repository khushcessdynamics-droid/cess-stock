  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ospace;color:#5E7E97;margin-right:2px;\">\n      <span style=\"width:6px;height:6px;border-radius:50%;background:#3FA86B;display:inline-block;\"><\u002Fspan>Saved\n    <\u002Fdiv>\n\n    <input ref=\"{{ fileRef }}\" type=\"file\" accept=\".json,.cessbom,application/json\" onchange=\"{{ onOpenFile }}\" style=\"display:none;\">\n\n    <button onclick=\"{{ openProject }}\" title=\"Open a saved project to keep editing\" style=\"height:33px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:transparent;color:#B6CCDD;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s;\" style-hover=\"border-color:rgba(255,255,255,.26);color:#fff;\">\n      <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z\"><\u002Fpath><\u002Fsvg>Open\n    <\u002Fbutton>\n    <button onclick=\"{{ saveProject }}\" title=\"Save an editable project file — reopen and edit anytime\" style=\"height:33px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:transparent;color:#B6CCDD;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s;\" style-hover=\"border-color:rgba(255,255,255,.26);color:#fff;\">\n      <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z\"><\u002Fpath><polyline points=\"17 21 17 13 7 13 7 21\"><\u002Fpolyline><polyline points=\"7 3 7 8 15 8\"><\u002Fpolyline><\u002Fsvg>Save Project\n    <\u002Fbutton>\n\n    <div style=\"width:1px;height:24px;background:rgba(255,255,255,.08);\"><\u002Fdiv>\n\n    <button onclick=\"{{ exportPNG }}\" title=\"Download as PNG image\" style=\"height:33px;padding:0 13px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:#1B2A3A;color:#B6CCDD;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s;\" style-hover=\"border-color:rgba(255,255,255,.26);color:#fff;\">\n      <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><circle cx=\"8.5\" cy=\"8.5\" r=\"1.5\"><\u002Fcircle><polyline points=\"21 15 16 10 5 21\"><\u002Fpolyline><\u002Fsvg>PNG\n    <\u002Fbutton>\n    <button onclick=\"{{ exportPDF }}\" title=\"Download print-ready PDF\" style=\"height:33px;padding:0 16px;border-radius:8px;border:none;background:#C2692C;color:#fff;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s;box-shadow:0 1px 8px rgba(194,105,44,.4);\" style-hover=\"background:#d4742f;box-shadow:0 3px 14px rgba(194,105,44,.55);\">\n      <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"><\u002Fpath><polyline points=\"14 2 14 8 20 8\"><\u002Fpolyline><\u002Fsvg>Download PDF\n    <\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- ░░ WORKSPACE ░░ -->\n  <div style=\"flex:1;display:grid;grid-template-columns:262px 1fr 452px;overflow:hidden;\">\n\n    <!-- ── PANE A : FORM ── -->\n    <div style=\"background:#13202E;border-right:1px solid rgba(255,255,255,.06);overflow-y:auto;padding:17px;\">\n\n      <sc-if value=\"{{ showDetails }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font-size:9.5px;font-family:'DM Mono',monospace;letter-spacing:.13em;text-transform:uppercase;color:#5E7E97;margin-bottom:13px;padding-bottom:7px;border-bottom:1px solid rgba(255,255,255,.06);\">Title Block<\u002Fdiv>\n\n        <div style=\"margin-bottom:11px;\"><div style=\"{{ lbl }}\">Assembly / BOM Title<\u002Fdiv><input value=\"{{ doc.title }}\" data-k=\"title\" onchange=\"{{ onDoc }}\" placeholder=\"e.g. 6-DOF Articulated Robot Arm\" style=\"{{ inp }}\" style-focus=\"border-color:#C2692C;\"><\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:9px;\">\n          <div style=\"margin-bottom:11px;\"><div style=\"{{ lbl }}\">Drawing / Doc No.<\u002Fdiv><input value=\"{{ doc.docno }}\" data-k=\"docno\" onchange=\"{{ onDoc }}\" placeholder=\"CESS-BOM-001\" style=\"{{ inp }}\" style-focus=\"border-color:#C2692C;\"><\u002Fdiv>\n          <div style=\"margin-bottom:11px;\"><div style=\"{{ lbl }}\">Revision<\u002Fdiv><input value=\"{{ doc.rev }}\" data-k=\"rev\" onchange=\"{{ onDoc }}\" placeholder=\"A\" style=\"{{ inp }}\" style-focus=\"border-color:#C2692C;\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-bottom:11px;\"><div style=\"{{ lbl }}\">Project<\u002Fdiv><input value=\"{{ doc.project }}\" data-k=\"project\" onchange=\"{{ onDoc }}\" placeholder=\"Robotics Division — Line 2\" style=\"{{ inp }}\" style-focus=\"border-color:#C2692C;\"><\u002Fdiv>\n\n        <div style=\"margin-bottom:11px;\"><div style=\"{{ lbl }}\">Assembly Part No.<\u002Fdiv><input value=\"{{ doc.assemblyPart }}\" data-k=\"assemblyPart\" onchange=\"{{ onDoc }}\" placeholder=\"Part no. of this assembly\" style=\"{{ inp }}\" style-focus=\"border-color:#C2692C;\"><\u002Fdiv>\n\n        <div style=\"margin-bottom:11px;\"><div style=\"{{ lbl }}\">Client / Customer<\u002Fdiv><input value=\"{{ doc.client }}\" data-k=\"client\" onchange=\"{{ onDoc }}\" placeholder=\"Internal\" style=\"{{ inp }}\" style-focus=\"border-color:#C2692C;\"><\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:9px;\">\n          <div style=\"margin-bottom:11px;\"><div style=\"{{ lbl }}\">Job / WO No.<\u002Fdiv><input value=\"{{ doc.jobno }}\" data-k=\"jobno\" onchange=\"{{ onDoc }}\" placeholder=\"—\" style=\"{{ inp }}\" style-focus=\"border-color:#C2692C;\"><\u002Fdiv>\n          <div style=\"margin-bottom:11px;\"><div style=\"{{ lbl }}\">Units<\u002Fdiv><input value=\"{{ doc.units }}\" data-k=\"units\" onchange=\"{{ onDoc }}\" placeholder=\"mm\" style=\"{{ inp }}\" style-focus=\"border-color:#C2692C;\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:9px;\">\n          <div style=\"margin-bottom:11px;\"><div style=\"{{ lbl }}\">Used-On / Next Assy<\u002Fdiv><input value=\"{{ doc.usedon }}\" data-k=\"usedon\" onchange=\"{{ onDoc }}\" placeholder=\"—\" style=\"{{ inp }}\" style-focus=\"border-color:#C2692C;\"><\u002Fdiv>\n          <div style=\"margin-bottom:11px;\"><div style=\"{{ lbl }}\">BOM Type<\u002Fdiv><input value=\"{{ doc.bomtype }}\" data-k=\"bomtype\" onchange=\"{{ onDoc }}\" placeholder=\"Engineering BOM\" style=\"{{ inp }}\" style-focus=\"border-color:#C2692C;\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1.2fr 1fr;gap:9px;\">\n          <div style=\"margin-bottom:11px;\"><div style=\"{{ lbl }}\">Date<\u002Fdiv><input type=\"date\" value=\"{{ doc.date }}\" data-k=\"date\" onchange=\"{{ onDoc }}\" style=\"{{ inp }}color-scheme:dark;padding:7px 9px;\" style-focus=\"border-color:#C2692C;\"><\u002Fdiv>\n          <div style=\"margin-bottom:11px;\"><div style=\"{{ lbl }}\">Sheet<\u002Fdiv><input value=\"{{ doc.sheet }}\" data-k=\"sheet\" onchange=\"{{ onDoc }}\" placeholder=\"1 of 1\" style=\"{{ inp }}\" style-focus=\"border-color:#C2692C;\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-bottom:11px;\"><div style=\"{{ lbl }}\">Status<\u002Fdiv><select value=\"{{ doc.status }}\" data-k=\"status\" onchange=\"{{ onDoc }}\" style=\"{{ inp }}cursor:pointer;\" style-focus=\"border-color:#C2692C;\"><option>RELEASED<\u002Foption><option>APPROVED<\u002Foption><option>FOR REVIEW<\u002Foption><option>DRAFT<\u002Foption><option>CONFIDENTIAL<\u002Foption><option>OBSOLETE<\u002Foption><\u002Fselect><\u002Fdiv>\n\n        <div style=\"margin-bottom:11px;\"><div style=\"{{ lbl }}\">Notes<\u002Fdiv><textarea value=\"{{ doc.notes }}\" data-k=\"notes\" onchange=\"{{ onDoc }}\" placeholder=\"Optional remarks…\" style=\"{{ inp }}resize:vertical;min-height:50px;font-family:'Inter',sans-serif;\"><\u002Ftextarea><\u002Fdiv>\n\n        <div style=\"height:1px;background:rgba(255,255,255,.06);margin:14px 0;\"><\u002Fdiv>\n        <div style=\"font-size:9.5px;font-family:'DM Mono',monospace;letter-spacing:.13em;text-transform:uppercase;color:#5E7E97;margin-bottom:12px;\">Approvals<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:9px;\">\n          <div style=\"margin-bottom:9px;\"><div style=\"{{ lblsm }}\">Role 1<\u002Fdiv><input value=\"{{ doc.sig1l }}\" data-k=\"sig1l\" onchange=\"{{ onDoc }}\" style=\"{{ inpsm }}\" style-focus=\"border-color:#C2692C;\"><\u002Fdiv>\n          <div style=\"margin-bottom:9px;\"><div style=\"{{ lblsm }}\">Name 1<\u002Fdiv><input value=\"{{ doc.sig1n }}\" data-k=\"sig1n\" onchange=\"{{ onDoc }}\" placeholder=\"—\" style=\"{{ inpsm }}\" style-focus=\"border-color:#C2692C;\"><\u002Fdiv>\n          <div style=\"margin-bottom:9px;\"><div style=\"{{ lblsm }}\">Role 2<\u002Fdiv><input value=\"{{ doc.sig2l }}\" data-k=\"sig2l\" onchange=\"{{ onDoc }}\" style=\"{{ inpsm }}\" style-focus=\"border-color:#C2692C;\"><\u002Fdiv>\n          <div style=\"margin-bottom:9px;\"><div style=\"{{ lblsm }}\">Name 2<\u002Fdiv><input value=\"{{ doc.sig2n }}\" data-k=\"sig2n\" onchange=\"{{ onDoc }}\" placeholder=\"—\" style=\"{{ inpsm }}\" style-focus=\"border-color:#C2692C;\"><\u002Fdiv>\n          <div style=\"margin-bottom:9px;\"><div style=\"{{ lblsm }}\">Role 3<\u002Fdiv><input value=\"{{ doc.sig3l }}\" data-k=\"sig3l\" onchange=\"{{ onDoc }}\" style=\"{{ inpsm }}\" style-focus=\"border-color:#C2692C;\"><\u002Fdiv>\n          <div style=\"margin-bottom:9px;\"><div style=\"{{ lblsm }}\">Name 3<\u002Fdiv><input value=\"{{ doc.sig3n }}\" data-k=\"sig3n\" onchange=\"{{ onDoc }}\" placeholder=\"—\" style=\"{{ inpsm }}\" style-focus=\"border-color:#C2692C;\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showOptions }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:9.5px;font-family:'DM Mono',monospace;letter-spacing:.13em;text-transform:uppercase;color:#5E7E97;margin-bottom:13px;padding-bottom:7px;border-bottom:1px solid rgba(255,255,255,.06);\">Item Numbering<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:8px;\">\n          <div><div style=\"{{ lbl }}\">Start At<\u002Fdiv><input type=\"number\" value=\"{{ start }}\" data-k=\"start\" onchange=\"{{ onNum }}\" style=\"{{ inp }}font-family:'DM Mono',monospace;\" style-focus=\"border-color:#C2692C;\"><\u002Fdiv>\n          <div><div style=\"{{ lbl }}\">Increment<\u002Fdiv><input type=\"number\" value=\"{{ step }}\" data-k=\"step\" onchange=\"{{ onNum }}\" style=\"{{ inp }}font-family:'DM Mono',monospace;\" style-focus=\"border-color:#C2692C;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:10px;color:#7C95A8;font-family:'DM Mono',monospace;background:#1B2A3A;border-radius:7px;padding:9px 11px;line-height:1.6;\">Items number as <span style=\"color:#D9772E;\">{{ numPreview }}<\u002Fspan><\u002Fdiv>\n\n        <div style=\"height:1px;background:rgba(255,255,255,.06);margin:16px 0;\"><\u002Fdiv>\n        <div style=\"font-size:9.5px;font-family:'DM Mono',monospace;letter-spacing:.13em;text-transform:uppercase;color:#5E7E97;margin-bottom:4px;\">Title Block Fields<\u002Fdiv>\n        <div style=\"font-size:10px;color:#5E7E97;margin-bottom:8px;line-height:1.5;\">Choose which fields appear in the document’s title block.<\u002Fdiv>\n        <sc-for list=\"{{ metaToggles }}\" as=\"mt\" hint-placeholder-count=\"6\">\n          <div onclick=\"{{ toggleMeta }}\" data-mk=\"{{ mt.key }}\" style=\"{{ optRow }}\" style-hover=\"background:#1B2A3A;\"><span style=\"{{ mt.box }}\">{{ mt.mark }}<\u002Fspan><span style=\"font-size:12px;color:#B6CCDD;\">{{ mt.label }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n\n        <div style=\"height:1px;background:rgba(255,255,255,.06);margin:16px 0;\"><\u002Fdiv>\n        <div style=\"font-size:9.5px;font-family:'DM Mono',monospace;letter-spacing:.13em;text-transform:uppercase;color:#5E7E97;margin-bottom:8px;\">Table Columns<\u002Fdiv>\n        <div onclick=\"{{ toggleOpt }}\" data-k=\"part\" style=\"{{ optRow }}\" style-hover=\"background:#1B2A3A;\"><span style=\"{{ optPartBox }}\">{{ optPartMark }}<\u002Fspan><span style=\"font-size:12px;color:#B6CCDD;\">Part No. column<\u002Fspan><\u002Fdiv>\n        <div onclick=\"{{ toggleOpt }}\" data-k=\"material\" style=\"{{ optRow }}\" style-hover=\"background:#1B2A3A;\"><span style=\"{{ optMaterialBox }}\">{{ optMaterialMark }}<\u002Fspan><span style=\"font-size:12px;color:#B6CCDD;\">Material column<\u002Fspan><\u002Fdiv>\n        <div onclick=\"{{ toggleOpt }}\" data-k=\"uom\" style=\"{{ optRow }}\" style-hover=\"background:#1B2A3A;\"><span style=\"{{ optUomBox }}\">{{ optUomMark }}<\u002Fspan><span style=\"font-size:12px;color:#B6CCDD;\">UOM column<\u002Fspan><\u002Fdiv>\n        <div onclick=\"{{ toggleOpt }}\" data-k=\"remarks\" style=\"{{ optRow }}\" style-hover=\"background:#1B2A3A;\"><span style=\"{{ optRemarksBox }}\">{{ optRemarksMark }}<\u002Fspan><span style=\"font-size:12px;color:#B6CCDD;\">Remarks column<\u002Fspan><\u002Fdiv>\n\n        <div style=\"height:1px;background:rgba(255,255,255,.06);margin:16px 0;\"><\u002Fdiv>\n        <div style=\"font-size:9.5px;font-family:'DM Mono',monospace;letter-spacing:.13em;text-transform:uppercase;color:#5E7E97;margin-bottom:8px;\">Sheet<\u002Fdiv>\n        <div onclick=\"{{ toggleOpt }}\" data-k=\"sig\" style=\"{{ optRow }}\" style-hover=\"background:#1B2A3A;\"><span style=\"{{ optSigBox }}\">{{ optSigMark }}<\u002Fspan><span style=\"font-size:12px;color:#B6CCDD;\">Approval / sign-off block<\u002Fspan><\u002Fdiv>\n        <div onclick=\"{{ toggleOpt }catch(err){ this.toast('Could not read that file'); } }; r.readAsText(f); e.target.value=''; }\n  resetAll(){ if(!confirm('Reset to a blank BOM? This clears all components and document info.'))return; const today=new Date().toISOString().split('T')[0]; const meta={client:true,project:true,assemblyPart:true,revision:true,date:true,sheet:true,docno:false,status:false,jobno:false,units:false,usedon:false,bomtype:false,totalItems:false,totalQty:false,groups:false}; this.setState({doc:{title:'',docno:'CESS-BOM-001',rev:'A',project:'',assemblyPart:'',client:'',jobno:'',units:'mm',usedon:'',bomtype:'Engineering BOM',date:today,sheet:'1 of 1',status:'DRAFT',notes:'',sig1l:'Prepared By',sig2l:'Checked By',sig3l:'Approved By',sig1n:'',sig2n:'',sig3n:''},opts:{part:true,material:true,uom:true,remarks:false,sig:true,notes:true,zebra:true,meta},cats:[],start:10,step:10}); this.toast('Reset to blank BOM'); }\n\n  // ── export ──\n  async renderCanvas(){ const src=this._doc; if(!src)return null; const wrap=document.createElement('div'); wrap.style.cssText='position:fixed;left:-99999px;top:0;width:794px;background:#fff;z-index:-1;'; const clone=src.cloneNode(true); clone.style.boxShadow='none'; clone.style.zoom='1'; if(window.CESS_LOGO){clone.querySelectorAll('img').forEach(im=>{im.src=window.CESS_LOGO;});} wrap.appendChild(clone); document.body.appendChild(wrap); try{ if(document.fonts&&document.fonts.ready)await document.fonts.ready; }catch(_){ } await new Promise(r=>setTimeout(r,300)); const canvas=await window.html2canvas(clone,{scale:2.2,useCORS:true,backgroundColor:'#ffffff',logging:false,windowWidth:794}); document.body.removeChild(wrap); return canvas; }\n  fname(ext){ const n=(this.state.doc.docno||'CESS_BOM').replace(/[^a-z0-9_-]+/gi,'_'); return n+'_Rev'+(this.state.doc.rev||'').replace(/[^a-z0-9]+/gi,'')+'.'+ext; }\n  async exportPNG(){ this.setState({busy:'Rendering PNG…'}); try{ const canvas=await this.renderCanvas(); const a=document.createElement('a'); a.href=canva
